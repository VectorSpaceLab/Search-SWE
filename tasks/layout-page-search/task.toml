schema_version = "1.4"
artifacts = ["/app", "/logs/agent/trajectory.json"]
[task]
name = "search-swe/layout-page-search"
version = "1.0.0"
description = "Retrieve concise, complete supporting page sets for questions about long visual documents."
authors = [{ name = "Haoran Jin" }]
keywords = ["information-retrieval", "visual-document", "layout", "multivector", "gpu"]
[metadata]
dataset = "MMLongBench-Doc original chart/figure/layout evidence annotations"
primary_metric = "EvidencePageSetF1"
public_query_count = 5
hidden_query_count = 515
[agent]
timeout_sec = 21600.0
user = "root"
network_mode = "no-network"
[verifier]
timeout_sec = 12000.0
user = "root"
environment_mode = "separate"
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]
[verifier.env]
OPENAI_BASE_URL = "${VERIFIER_OPENAI_BASE_URL:-}"
OPENAI_API_KEY = "${VERIFIER_OPENAI_API_KEY:-}"
[environment]
build_timeout_sec = 1800.0
workdir = "/app"
os = "linux"
network_mode = "no-network"
cpus = 8
memory_mb = 32768
storage_mb = 102400
gpus = 1
