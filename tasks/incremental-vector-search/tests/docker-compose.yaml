services:
  main:
    cpuset: "64-79"
    pids_limit: 256
    mem_limit: 32g
    memswap_limit: 32g
    volumes:
    - type: bind
      source: ../data/public
      target: /task/public
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../data/private
      target: /private
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../environment/exact_search.py
      target: /task/reference/exact_search.py
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../environment/baseline_search.py
      target: /task/reference/baseline_search.py
      read_only: true
      bind:
        create_host_path: false
