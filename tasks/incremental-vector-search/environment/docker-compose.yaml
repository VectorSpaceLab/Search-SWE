services:
  main:
    cpuset: "${INCREMENTAL_VECTOR_CPUSET:-}"
    cpu_period: 100000
    cpu_quota: 1600000
    pids_limit: 256
    mem_limit: 32g
    memswap_limit: 32g
    volumes:
    - type: bind
      source: ../data/corpus
      target: /task/data/corpus
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./docs
      target: /task/docs
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./exact_search.py
      target: /task/reference/exact_search.py
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./baseline_search.py
      target: /task/reference/baseline_search.py
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./profile_public.py
      target: /task/tools/profile_public.py
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: "${INCREMENTAL_VECTOR_PLATFORM_ROOT:?Start through the evaluation launcher}/public"
      target: /task/platform
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: "${INCREMENTAL_VECTOR_PLATFORM_ROOT:?Start through the evaluation launcher}/validation"
      target: /task/data/validation
      read_only: true
      bind:
        create_host_path: false
