schema_version = "1.4"

artifacts = [
    "/logs/agent/trajectory.json",
    "/app",
]

[task]
name = "search-swe/resource-bounded-multivector-search"
version = "0.3.2"
description = "Reduce complete-workload query latency while retaining at least 99% exact MaxSim Recall@100."
authors = [{ name = "jianlyu" }]
keywords = ["information-retrieval", "multi-vector", "colbert", "maxsim", "cpu", "quora"]
objective = "Minimize query time at Recall@100 >= 0.99; normalize improvement between frozen baseline and reference times."

[metadata]
primary_metric = "Normalized relative query-time improvement at Recall@100 >= 0.99"
corpus_document_count = 522931
public_query_count = 5000
hidden_query_count = 10000
minimum_recall = 0.99

[agent]
timeout_sec = 7200.0
user = "submission"
network_mode = "no-network"

[verifier]
timeout_sec = 3300.0
user = "root"
environment_mode = "separate"
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]

[verifier.env]
OPENAI_BASE_URL = "${VERIFIER_OPENAI_BASE_URL:-}"
OPENAI_API_KEY = "${VERIFIER_OPENAI_API_KEY:-}"

[[verifier.collect]]
command = "/opt/conda/bin/python /task/budget_evidence.py collect"
user = "root"
timeout_sec = 120.0

[environment]
build_timeout_sec = 1800.0
workdir = "/app"
os = "linux"
network_mode = "no-network"
cpus = 8
memory_mb = 16384
storage_mb = 32768
gpus = 0

[environment.healthcheck]
command = "/opt/conda/bin/python /task/budget_evidence.py setup"
timeout_sec = 30.0
retries = 1
