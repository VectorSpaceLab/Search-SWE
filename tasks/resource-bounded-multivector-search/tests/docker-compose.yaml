services:
  main:
    cpuset: ${MULTIVECTOR_CPUSET:-32-39}
    mem_limit: 16g
    memswap_limit: 16g
    cpus: 8
    pids_limit: 512
    volumes:
    - type: bind
      source: ${MULTIVECTOR_STORAGE_ROOT}/evidence
      target: /task-evidence
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../data/public
      target: /task/data/public
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../data/verifier
      target: /task/data/verifier
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${MULTIVECTOR_STORAGE_ROOT:?Prepare job storage first}/verifier
      target: /work
      bind:
        create_host_path: false
