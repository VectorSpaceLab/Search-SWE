services:
  main:
    mem_limit: 16g
    command: ["sleep", "infinity"]
    read_only: true
    pids_limit: 512
    shm_size: 1g
    mem_swappiness: 0
    memswap_limit: 16g
    tmpfs:
    - /app:rw,exec,nosuid,nodev,size=91g,mode=0755
    - /tmp:rw,exec,nosuid,nodev,size=1g,mode=1777
    - /var/tmp:rw,exec,nosuid,nodev,size=1g,mode=1777
    - /opt/harbor:rw,exec,nosuid,nodev,size=256m,mode=0755
    # Separate verifiers receive Harbor's collected artifacts by upload.
    # These transport pages share the same 16-GiB cgroup RAM limit.
    - /logs/agent:rw,nosuid,nodev,size=91g,mode=0700
    - /logs/artifacts:rw,nosuid,nodev,size=1g,mode=0700
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities:
            - gpu
    volumes:
    - type: bind
      source: ../data/corpus
      target: /task/data/corpus
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../data/verifier
      target: /private/data
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../data/development
      target: /task/data/development
      read_only: true
      bind:
        create_host_path: false
