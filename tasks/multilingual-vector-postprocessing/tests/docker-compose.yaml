services:
  main:
    mem_limit: 16g
    command: ["sleep", "infinity"]
    pids_limit: 512
    shm_size: 1g
    mem_swappiness: 0
    memswap_limit: 16g
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities:
            - gpu
    volumes:
    - type: bind
      source: ./runtime
      target: /task/runtime
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../data/corpus
      target: /task/data/corpus
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../data/verifier
      target: /private/data
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../data/development
      target: /task/data/development
      read_only: true
      bind:
        create_host_path: false
