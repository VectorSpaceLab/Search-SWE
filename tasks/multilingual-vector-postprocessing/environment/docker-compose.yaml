services:
  main:
    mem_limit: 16g
    # The trusted collector stops every process except PID 1 and its own
    # ancestry. Harbor's shell-wrapped sleep would exit when its child stops.
    command: ["sleep", "infinity"]
    read_only: true
    pids_limit: 512
    shm_size: 1g
    mem_swappiness: 0
    memswap_limit: 16g
    tmpfs:
    - /app:rw,exec,nosuid,nodev,size=91g,mode=0755
    - /tmp:rw,exec,nosuid,nodev,size=1g,mode=1777
    - /root:rw,exec,nosuid,nodev,size=1g,mode=0700
    - /var/tmp:rw,exec,nosuid,nodev,size=1g,mode=1777
    - /opt/harbor:rw,exec,nosuid,nodev,size=256m,mode=0755
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities:
            - gpu
    volumes:
    - type: bind
      source: ../data/train
      target: /task/data/train
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../data/probe
      target: /task/data/probe
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../data/corpus
      target: /task/data/corpus
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../data/development
      target: /task/data/development
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../data/baselines
      target: /task/data/baselines
      read_only: true
      bind:
        create_host_path: false
