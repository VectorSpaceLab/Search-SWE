services:
  main:
    mem_limit: 16g
    # The trusted collector stops every process except PID 1 and its own
    # ancestry. Harbor's shell-wrapped sleep would exit when its child stops.
    command: ["sleep", "infinity"]
    pids_limit: 512
    shm_size: 1g
    mem_swappiness: 0
    memswap_limit: 16g
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities:
            - gpu
    volumes:
    - type: bind
      source: ./runtime
      target: /task/runtime
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./docs
      target: /task/docs
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./baselines
      target: /task/baselines
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../data/train
      target: /task/data/train
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../data/probe
      target: /task/data/probe
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../data/corpus
      target: /task/data/corpus
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../data/development
      target: /task/data/development
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../data/baselines
      target: /task/data/baselines
      read_only: true
      bind:
        create_host_path: false
