schema_version = "1.4"
artifacts = ["/app", "/logs/agent/trajectory.json"]
[task]
name = "search-swe/document-page-search"
version = "1.0.0"
description = "Build a multilingual page index over complete visual document collections."
authors = [{ name = "Haoran Jin" }]
keywords = ["visual-documents", "page-retrieval", "multilingual"]
[metadata]
dataset = "ViDoRe V3, eight public domains"
primary_metric = "DomainMacroNDCG@10"
public_query_count = 30
hidden_query_count = 14484
[agent]
timeout_sec = 7200.0
user = "root"
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai", "api.jina.ai"]
[verifier]
timeout_sec = 19200.0
user = "root"
environment_mode = "separate"
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai", "api.jina.ai"]
[environment]
build_timeout_sec = 1800.0
workdir = "/app"
cpus = 8
memory_mb = 32768
storage_mb = 102400
gpus = 1
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai", "api.jina.ai"]
os = "linux"
[environment.env]
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY:-}"
JINA_API_KEY = "${JINA_API_KEY:-}"
[verifier.env]
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY:-}"
JINA_API_KEY = "${JINA_API_KEY:-}"
OPENAI_BASE_URL = "${VERIFIER_OPENAI_BASE_URL:-}"
OPENAI_API_KEY = "${VERIFIER_OPENAI_API_KEY:-}"
