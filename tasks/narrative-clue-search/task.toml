schema_version = "1.4"
artifacts = ["/app", "/logs/agent/trajectory.json"]
[task]
name = "search-swe/narrative-clue-search"
version = "1.0.0"
description = "Build a document search system for long, uncertain recollections."
authors = [{ name = "Haoran Jin" }]
keywords = ["information-retrieval", "semantic-retrieval", "query-rewriting", "narrative"]
[metadata]
dataset = "TREC ToT 2023"
primary_metric = "QueryMeanNDCG@10"
public_query_count = 5
hidden_query_count = 445
[agent]
timeout_sec = 7200.0
user = "root"
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai", "api.jina.ai"]
[verifier]
timeout_sec = 12000.0
user = "root"
environment_mode = "separate"
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai", "api.jina.ai"]
[environment]
build_timeout_sec = 1800.0
workdir = "/app"
cpus = 8
memory_mb = 32768
storage_mb = 102400
gpus = 0
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai", "api.jina.ai"]
os = "linux"
[environment.env]
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY:-}"
JINA_API_KEY = "${JINA_API_KEY:-}"
[verifier.env]
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY:-}"
JINA_API_KEY = "${JINA_API_KEY:-}"
OPENAI_BASE_URL = "${VERIFIER_OPENAI_BASE_URL:-}"
OPENAI_API_KEY = "${VERIFIER_OPENAI_API_KEY:-}"
