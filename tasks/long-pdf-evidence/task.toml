schema_version = "1.4"

artifacts = [
    "/app",
    "/logs/agent/trajectory.json",
]

[task]
name = "search-swe/long-pdf-evidence"
version = "1.0.1"
description = "Retrieve original sentences that completely support concise questions about a long novel."
authors = [{ name = "Search-SWE" }, { name = "Bingyu" }]
keywords = ["information-retrieval", "search", "evidence locator"]

[metadata]
dataset = "single long PDF"
primary_metric = "SentenceEvidenceAccuracy"
metric_k = 5
public_example_count = 10
hidden_query_count = 12
sentence_count = 28798
answer_judge_model = "deepseek/deepseek-v4.1-flash"
answer_judge_reasoning_effort = "high"
query_concurrency = 5
data_status = "Unchanged published PDF; published sentence inventory and revised public examples; 12 authored hidden queries."

[agent]
timeout_sec = 7200.0
user = "root"
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "api.jina.ai",
]

[verifier]
timeout_sec = 10800.0
user = "root"
environment_mode = "separate"
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "api.jina.ai",
]

[environment]
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "api.jina.ai",
]
build_timeout_sec = 1800.0
workdir = "/app"
cpus = 16
memory_mb = 16384
storage_mb = 102400
gpus = 0
os = "linux"

[environment.env]
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY:-}"
JINA_API_KEY = "${JINA_API_KEY:-}"

[verifier.env]
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY:-}"
JINA_API_KEY = "${JINA_API_KEY:-}"
ANSWER_JUDGE_BASE_URL = "https://openrouter.ai/api/v1"
ANSWER_JUDGE_MODEL_NAME = "deepseek/deepseek-v4.1-flash"
ANSWER_JUDGE_API_KEY = "${ANSWER_JUDGE_API_KEY:-}"
OPENAI_BASE_URL = "${VERIFIER_OPENAI_BASE_URL:-}"
OPENAI_API_KEY = "${VERIFIER_OPENAI_API_KEY:-}"
