services:
  main:
    pids_limit: 256
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - type: bind
        source: ../models/Qwen3-1.7B
        target: /task/models/Qwen3-1.7B
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../data/public.jsonl.gz
        target: /task/data/public.jsonl.gz
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../data/public-qrels.json
        target: /task/data/public-qrels.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./docs
        target: /task/docs
        read_only: true
        bind:
          create_host_path: false
