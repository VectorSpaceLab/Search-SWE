schema_version = "1.4"
artifacts = ["/app", "/logs/agent/trajectory.json"]
[task]
name = "search-swe/khmer-embedding-training"
version = "1.0.0"
description = "Train a Khmer-to-English embedding model and build a reusable document retrieval system."
authors = [{ name = "Haoran Jin" }]
keywords = ["information-retrieval", "cross-lingual", "khmer", "embedding", "training", "gpu"]
[metadata]
dataset = "MKQA Khmer / BEIR NQ"
backbone = "intfloat/multilingual-e5-large"
auxiliary_model = "Qwen/Qwen3.5-9B"
primary_metric = "Recall@100"
public_query_count = 3
hidden_query_count = 1000
corpus_count = 2681468
validation_seed = 20261014
[agent]
timeout_sec = 21600.0
user = "root"
network_mode = "no-network"
[verifier]
timeout_sec = 48000.0
user = "root"
environment_mode = "separate"
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]
[verifier.env]
OPENAI_BASE_URL = "${VERIFIER_OPENAI_BASE_URL:-}"
OPENAI_API_KEY = "${VERIFIER_OPENAI_API_KEY:-}"
[environment]
build_timeout_sec = 1800.0
workdir = "/app"
os = "linux"
network_mode = "no-network"
cpus = 8
memory_mb = 32768
storage_mb = 102400
gpus = 1
