services:
  main:
    cpus: 8
    environment:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      LD_LIBRARY_PATH: /usr/local/nvidia/lib:/usr/local/nvidia/lib64
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities:
            - gpu
    volumes:
    - type: bind
      source: ../data/corpus
      target: /task/data/corpus
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../environment/docs
      target: /task/docs
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../models
      target: /task/models
      read_only: true
      bind:
        create_host_path: false
