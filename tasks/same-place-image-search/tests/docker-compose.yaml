services:
  main:
    cpu_period: 100000
    cpu_quota: 800000
    environment:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities:
            - gpu
    volumes:
    - type: bind
      source: ../data/corpus
      target: /task/data/corpus
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../models
      target: /task/models
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../environment/docs
      target: /task/docs
      read_only: true
      bind:
        create_host_path: false
