schema_version = "1.4"

artifacts = [
    "/app/submission",
    "/logs/agent/trajectory.json",
]

[task]
name = "search-swe/task-2-2"
version = "0.1"
description = "Improve a fixed-backbone code-retrieval embedder on supplied training data."
authors = [{ name = "Search-SWE" }]
keywords = ["information-retrieval", "code-retrieval", "embedding", "fine-tuning", "gpu"]

[metadata]
task_type = "optimize"
dataset = "code-retrieval"
backbone = "BAAI/bge-base-en-v1.5"
primary_metric = "held-out Accuracy@1 improvement"
train_query_count = 5000
public_query_count = 10
hidden_query_count = 200
validation_seed = 42

[agent]
timeout_sec = 43200.0
user = "root"
network_mode = "public"

[verifier]
timeout_sec = 5100.0
user = "root"
environment_mode = "separate"
network_mode = "public"

[verifier.env]
OPENAI_BASE_URL = "${OPENAI_BASE_URL:-}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"

[environment]
build_timeout_sec = 1800.0
workdir = "/app"
os = "linux"
network_mode = "no-network"
cpus = 8
memory_mb = 32768
storage_mb = 102400
gpus = 0
