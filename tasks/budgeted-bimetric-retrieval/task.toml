schema_version = "1.4"
artifacts = ["/app", "/logs/agent/trajectory.json"]

[task]
name = "search-swe/budgeted-bimetric-retrieval"
version = "1.0.0"
description = "Improve retrieval over 250,000 NQ passages with 20 controlled expensive distances and two seconds per query."
authors = [{name = "jianlyu"}]
keywords = ["retrieval", "bimetric", "nq", "query-budget", "cpu"]

[metadata]
primary_metric = "baseline-normalized mean nDCG@10"
corpus_documents = 250000
source_corpus_documents = 2681468
asset_ceiling_bytes = 5000000000
public_queries = 500
hidden_queries = 3452
score_calls_per_query = 20
query_seconds = 2.0
build_seconds = 3600

[agent]
timeout_sec = 7200.0
user = "submission"
network_mode = "no-network"

[verifier]
timeout_sec = 62000.0
user = "root"
environment_mode = "separate"
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]

[environment]
build_timeout_sec = 1800.0
workdir = "/app"
os = "linux"
network_mode = "no-network"
cpus = 16
memory_mb = 32768
storage_mb = 65536
gpus = 0

[verifier.env]
OPENAI_BASE_URL = "${VERIFIER_OPENAI_BASE_URL:-}"
OPENAI_API_KEY = "${VERIFIER_OPENAI_API_KEY:-}"
