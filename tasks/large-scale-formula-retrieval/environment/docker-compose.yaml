services:
  main:
    cpuset: ${FORMULA_CPUSET:-80,81}
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 2
    pids_limit: 512
    environment:
      FORMULA_DIAGNOSTICS: ${FORMULA_STORAGE_ROOT}/agent/diagnostics
    volumes:
    - type: bind
      source: ${FORMULA_STORAGE_ROOT}/agent/diagnostics
      target: ${FORMULA_STORAGE_ROOT}/agent/diagnostics
      bind:
        create_host_path: false
    - type: bind
      source: ${FORMULA_STORAGE_ROOT}/evidence
      target: /task-evidence
      bind:
        create_host_path: false
    - type: bind
      source: ../data/public
      target: /task/data/public
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${FORMULA_STORAGE_ROOT:?Prepare job storage first}/agent/app
      target: /app
      bind:
        create_host_path: false
    - type: bind
      source: ${FORMULA_STORAGE_ROOT:?Prepare job storage first}/agent/tmp
      target: /tmp
      bind:
        create_host_path: false
    - type: bind
      source: ${FORMULA_STORAGE_ROOT:?Prepare job storage first}/agent/var-tmp
      target: /var/tmp
      bind:
        create_host_path: false
    - type: bind
      source: ${FORMULA_STORAGE_ROOT:?Prepare job storage first}/agent/home
      target: /home/submission
      bind:
        create_host_path: false
    - type: bind
      source: ${FORMULA_STORAGE_ROOT:?Prepare job storage first}/agent/shm
      target: /dev/shm
      bind:
        create_host_path: false
    - type: bind
      source: ${FORMULA_STORAGE_ROOT:?Prepare job storage first}/agent/lock
      target: /run/lock
      bind:
        create_host_path: false
