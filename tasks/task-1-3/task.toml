schema_version = "1.4"

artifacts = [
    "/app",
    "/logs/agent/trajectory.json",
]

[task]
name = "search-swe/task-1-3"
version = "0.3.0"
description = "Build an evidence-grounded RAG system over a local collection of research-paper PDFs."
authors = [{ name = "Search-SWE" }]
keywords = ["information-retrieval", "search", "RAG"]

[metadata]
task_type = "create"
dataset = "research-paper PDFs"
primary_metric = "LLMJudgeAccuracy"
public_example_count = 25
hidden_query_count = 25
query_concurrency = 5
data_status = "Generated queries"

[agent]
timeout_sec = 7200.0
user = "root"
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "*.openrouter.ai",
    "api.jina.ai",
    "*.jina.ai",
]

[verifier]
timeout_sec = 14400.0
user = "root"
environment_mode = "separate"
network_mode = "public"

[environment]
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "*.openrouter.ai",
    "api.jina.ai",
    "*.jina.ai",
]
build_timeout_sec = 1800.0
workdir = "/app"
cpus = 16
memory_mb = 65536
storage_mb = 102400
gpus = 0
os = "linux"

[environment.env]
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY:-}"
JINA_API_KEY = "${JINA_API_KEY:-}"

[verifier.env]
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY:-}"
JINA_API_KEY = "${JINA_API_KEY:-}"
ANSWER_JUDGE_MODEL_NAME = "${ANSWER_JUDGE_MODEL_NAME:-}"
ANSWER_JUDGE_BASE_URL = "${ANSWER_JUDGE_BASE_URL:-}"
ANSWER_JUDGE_API_KEY = "${ANSWER_JUDGE_API_KEY:-}"
OPENAI_BASE_URL = "${VERIFIER_OPENAI_BASE_URL:-}"
OPENAI_API_KEY = "${VERIFIER_OPENAI_API_KEY:-}"
