schema_version = "1.4"

artifacts = [
    "/app",
    "/logs/agent/trajectory.json",
]

[task]
name = "search-swe/deletion-resilient-vector-search"
version = "1.0.0"
description = "Maintain graph-vector search quality and reclaim memory through 100 deletion stages on SIFT1M and GIST1M."
authors = [{ name = "jianlyu" }]
keywords = ["vector-search", "dynamic-index", "deletion", "hnsw", "recall", "memory", "cpu"]

[metadata]
primary_metric = "normalized log-error reduction * (0.8 + 0.2 memory efficiency)"
stages = 100
delete_batch_size = 8000
initial_vectors = 1000000
query_time_ratio = 0.2

[agent]
timeout_sec = 7200.0
user = "submission"
network_mode = "no-network"

[verifier]
timeout_sec = 86400.0
user = "root"
environment_mode = "separate"
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]

[environment]
build_timeout_sec = 1800.0
workdir = "/app"
os = "linux"
network_mode = "no-network"
cpus = 16
memory_mb = 65536
storage_mb = 102400
gpus = 0

[verifier.env]
OPENAI_BASE_URL = "${VERIFIER_OPENAI_BASE_URL:-}"
OPENAI_API_KEY = "${VERIFIER_OPENAI_API_KEY:-}"
