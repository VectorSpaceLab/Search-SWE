services:
  main:
    mem_limit: 32g
    cpuset: ${DELETION_CPUSET:-0-15}
    memswap_limit: 32g
    pids_limit: 512
    volumes:
    - type: bind
      source: ../data/public
      target: /task/data/public
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./docs
      target: /task/docs
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${DELETION_STORAGE_ROOT:?Prepare job storage first}/agent/app
      target: /app
      bind:
        create_host_path: false
    - type: bind
      source: ${DELETION_STORAGE_ROOT:?Prepare job storage first}/agent/tmp
      target: /tmp
      bind:
        create_host_path: false
    - type: bind
      source: ${DELETION_STORAGE_ROOT:?Prepare job storage first}/agent/var-tmp
      target: /var/tmp
      bind:
        create_host_path: false
    - type: bind
      source: ${DELETION_STORAGE_ROOT:?Prepare job storage first}/agent/home
      target: /home/submission
      bind:
        create_host_path: false
    - type: bind
      source: ${DELETION_STORAGE_ROOT:?Prepare job storage first}/agent/shm
      target: /dev/shm
      bind:
        create_host_path: false
    - type: bind
      source: ${DELETION_STORAGE_ROOT:?Prepare job storage first}/agent/lock
      target: /run/lock
      bind:
        create_host_path: false
