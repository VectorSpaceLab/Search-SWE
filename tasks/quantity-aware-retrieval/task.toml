schema_version = "1.4"

artifacts = ["/app", "/logs/agent/trajectory.json"]

[task]
name = "search-swe/quantity-aware-retrieval"
version = "0.1.1"
description = "Build a retrieval system that ranks clinical passages by relevance to natural-language numerical conditions."
authors = [{ name = "Bingyu" }]
keywords = ["information-retrieval", "numerical-reasoning", "units", "gpu"]

[metadata]
dataset = "MedQuant, original passages and qrels"
primary_metric = "Normalized binary nDCG@10"
metric_k = 10
corpus_document_count = 153252
public_query_count = 0
hidden_query_count = 210
example_count = 80000
base_model = "Qwen/Qwen3-Embedding-0.6B"
baseline_ndcg_at_10 = 0.1838
query_timeout_seconds = 5.0
index_build_timeout_seconds = 1200.0
gpu_hardware = "1 x NVIDIA A100 40GB"
data_status = "Published public data; all original 210 questions private; original text and qrels preserved; 80000 synthetic labeled examples."

[agent]
timeout_sec = 21600.0
user = "root"
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai", "api.jina.ai"]

[verifier]
timeout_sec = 4800.0
user = "root"
environment_mode = "separate"
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai", "api.jina.ai"]

[environment]
build_timeout_sec = 1800.0
workdir = "/app"
os = "linux"
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai", "api.jina.ai"]
cpus = 16
memory_mb = 32768
storage_mb = 102400
gpus = 1

[environment.env]
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY:-}"
JINA_API_KEY = "${JINA_API_KEY:-}"

[verifier.env]
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY:-}"
JINA_API_KEY = "${JINA_API_KEY:-}"
OPENAI_BASE_URL = "${VERIFIER_OPENAI_BASE_URL:-}"
OPENAI_API_KEY = "${VERIFIER_OPENAI_API_KEY:-}"
