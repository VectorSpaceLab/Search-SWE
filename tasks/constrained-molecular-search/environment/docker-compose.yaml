services:
  main:
    cpus: 16
    mem_limit: 32g
    pids_limit: 512
    memswap_limit: 32g
    shm_size: 2g
    tmpfs:
    - /tmp:rw,exec,nosuid,nodev,size=512m,mode=1777
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities:
            - gpu
    volumes:
    - type: bind
      source: ../data/public/library
      target: /task/library
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../models
      target: /task/models
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../data/public/train
      target: /task/train
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../data/public/dev
      target: /task/dev
      read_only: true
      bind:
        create_host_path: false
