schema_version = "1.4"

artifacts = [
    "/var/tmp/molecular-submission.tar",
    "/logs/agent/trajectory.json",
]

[task]
name = "search-swe/constrained-molecular-search"
version = "0.3.2"
description = "Recover the truly feasible top 10,000 compounds from a complete molecular library under a two-second query deadline."
authors = [{ name = "hanhainebula" }]
keywords = ["molecular-search", "constraints", "combinatorial-library", "gpu", "top-k"]

[metadata]
primary_metric = "Macro mean Recall@10000; public proportional-budget Recall@279"
paper = "https://proceedings.mlr.press/v306/pedawi26a.html"
preparation_seconds = 3600
query_hard_seconds = 2.0
output_k = 10000

[agent]
timeout_sec = 21600.0
user = "root"
network_mode = "no-network"

[verifier]
timeout_sec = 4800.0
user = "root"
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
command = "/opt/conda/bin/python /task/runtime/transfer.py --collect"
user = "root"
timeout_sec = 600.0

[environment]
build_timeout_sec = 7200.0
workdir = "/app"
os = "linux"
network_mode = "no-network"
cpus = 16
memory_mb = 32768
storage_mb = 65536
gpus = 1
