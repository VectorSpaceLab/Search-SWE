schema_version = "1.4"

artifacts = [
    "/app",
    "/logs/agent/trajectory.json",
]

[task]
name = "search-swe/task-1-2"
version = "0.1"
description = "Build a memory-constrained dense-vector retrieval system over 1.5 million precomputed NQ corpus vectors."
authors = [{ name = "Search-SWE" }]
keywords = ["search", "retrieval", "dense-retrieval", "vector-search", "nq", "memory-constrained", "cpu", "indexing"]

[metadata]
task_type = "create"
dataset = "NaturalQuestions"
primary_metric = "Accuracy@3"
metric_k = 3
public_example_count = 5
hidden_query_count = 55
corpus_vector_count = 1500000
corpus_dimension = 1024
corpus_vector_bytes = 6144000000
data_status = "1.5M precomputed NQ corpus vectors and difficulty-balanced disjoint public/hidden query-vector splits installed"

[agent]
timeout_sec = 7200.0
user = "root"
network_mode = "public"

[verifier]
timeout_sec = 7200.0
user = "root"
environment_mode = "separate"
network_mode = "public"

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
workdir = "/app"
cpus = 16
memory_mb = 2048
storage_mb = 102400
gpus = 0
os = "linux"

[verifier.env]
OPENAI_BASE_URL = "${OPENAI_BASE_URL:-}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"
