services:
  main:
    # Isolated submission workers drop this capability with their root UID.
    cap_add:
    - CHECKPOINT_RESTORE
    pids_limit: 512
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities:
            - gpu
    volumes:
    - type: bind
      source: ../data/corpus/robust04.jsonl
      target: /task/corpus/robust04.jsonl
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../data/corpus/core17.jsonl
      target: /task/corpus/core17.jsonl
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../data/corpus/news21.jsonl
      target: /task/corpus/news21.jsonl
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../models/e5-large-v2
      target: /task/models/e5-large-v2
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../environment/runtime
      target: /task/runtime
      read_only: true
      bind:
        create_host_path: false
