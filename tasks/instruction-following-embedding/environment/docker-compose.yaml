services:
  main:
    # Trusted storage accounting inspects mmap backing files after unlink.
    cap_add:
    - CHECKPOINT_RESTORE
    pids_limit: 512
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities:
            - gpu
    volumes:
    - type: bind
      source: ../data/corpus/robust04.jsonl
      target: /task/corpus/robust04.jsonl
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../data/corpus/core17.jsonl
      target: /task/corpus/core17.jsonl
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../data/corpus/news21.jsonl
      target: /task/corpus/news21.jsonl
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../models/e5-large-v2
      target: /task/models/e5-large-v2
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../data/train.jsonl
      target: /task/data/train.jsonl
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./runtime
      target: /task/runtime
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../data/validation
      target: /task/data/validation
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./docs
      target: /task/docs
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./baselines
      target: /task/baselines
      read_only: true
      bind:
        create_host_path: false
