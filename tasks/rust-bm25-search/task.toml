schema_version = "1.4"

artifacts = [
    "/app/submission",
]

[task]
name = "search-swe/rust-bm25-search"
version = "1.0.0"
description = "Build a Rust BM25 index from MS MARCO passages and improve quality, search time and index size above a pinned Pyserini quality floor."
authors = [{ name = "MXueguang", email = "x93ma@edu.uwaterloo.ca" }]
keywords = ["information-retrieval", "bm25", "rust", "cpu", "efficiency"]

[metadata]
primary_metric = "quality-gated BM25 quality/time/disk tradeoff"

[agent]
timeout_sec = 10800.0
user = "root"
network_mode = "no-network"

[verifier]
timeout_sec = 18000.0
user = "root"
environment_mode = "separate"
network_mode = "no-network"

[environment]
build_timeout_sec = 1800.0
workdir = "/app/submission"
os = "linux"
network_mode = "no-network"
cpus = 4
memory_mb = 16384
storage_mb = 65536
gpus = 0
