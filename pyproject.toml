[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "search-swe"
version = "0.1.0.dev0"
description = "Configure and run Search-SWE coding-agent evaluations"
readme = "docs/cli.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "harbor==0.22.0",
  "huggingface_hub>=1.0,<2.0",
  "questionary>=2.1,<3",
  "prompt_toolkit>=3.0.48,<4",
  "python-dotenv>=1.0,<2",
  "psutil>=7,<8",
  "PyYAML>=6,<7",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/VectorSpaceLab/Search-SWE"
Homepage = "https://search-swe.github.io/"

[project.scripts]
search-swe = "search_swe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
