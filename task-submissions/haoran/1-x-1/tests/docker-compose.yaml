services:
  main:
    volumes:
      - type: bind
        source: ../data/history.jsonl
        target: /task/data/history.jsonl
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../environment/docs
        target: /task/docs
        read_only: true
        bind:
          create_host_path: false
